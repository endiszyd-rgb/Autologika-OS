name: iOS PWA

on:
  push:
    branches:
      - main
      - feature/ios-pwa
      - audit/ios-sync-integrity
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Testy regresji
        run: npm test

      - name: Zbuduj PWA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sprawdź manifest i Service Worker
        run: node scripts/check-pwa-build.mjs

      - name: Sprawdź układ iPhone 16 Plus
        env:
          PWA_FAKE_AUTH: '1'
          PWA_AUDIT_ALL_MODULES: '1'
          PWA_EXPECT_MOBILE_DOCK: '1'
          PWA_EXPECT_HEADING: Pulpit warsztatu
        run: xvfb-run -a node scripts/run-pwa-browser-smoke.cjs

      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Wyślij artefakt PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Opublikuj PWA
        id: deployment
        uses: actions/deploy-pages@v4
