<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://aeikhyntzrynpypleqqe.supabase.co; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>AutoLogika — akceptacja naprawy</title>
  <style>
    :root{color-scheme:dark;--bg:#070a08;--panel:#111813;--panel2:#151e17;--line:#334139;--text:#f3f6f1;--muted:#9da9a0;--red:#ef2639;--green:#bdf47c;--amber:#e8bd56;--shadow:0 22px 70px #0008}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% -10%,#4a1118 0,transparent 34%),radial-gradient(circle at 10% 10%,#173320 0,transparent 28%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
    main{position:relative;max-width:820px;margin:auto;padding:28px 16px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-weight:950;font-size:18px;letter-spacing:.18em}.brand i{color:var(--red);font-style:normal}.secure{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.secure:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}
    .card{background:linear-gradient(145deg,#172019f2,#0e1410f5);border:1px solid var(--line);border-radius:20px;padding:22px;margin:15px 0;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.hero{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:3px solid var(--red)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:#aeb9b0;text-transform:uppercase}.hero h1{font-size:30px;line-height:1.12;margin:7px 0}.muted{color:var(--muted)}.doc{text-align:right}.doc b{display:block}.doc span{font-size:12px;color:var(--muted)}
    .items{overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span,.row small{display:block;color:var(--muted)}.row small{margin-top:3px}.row p{margin:7px 0 0;color:#c8d0ca}.row strong{white-space:nowrap}.total{padding-top:18px;text-align:right;font-size:30px;font-weight:950;color:var(--green)}
    .previous{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.previous div{padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b100d}.previous b,.previous span{display:block}.previous span{font-size:9px;letter-spacing:.08em;color:var(--muted)}.previous div:last-child{border-color:#62804d;background:#172116}.previous div:last-child b{color:var(--green)}
    label{display:block;font-weight:750;margin:14px 0 7px}.consent{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #61734f;border-radius:13px;background:#162016}.consent input{width:23px;height:23px;flex:0 0 23px;accent-color:var(--green)}textarea{width:100%;min-height:88px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#070b08;color:var(--text);font:inherit;resize:vertical}.pad{border:1px solid #647169;border-radius:14px;background:#fff;overflow:hidden}.pad canvas{display:block;width:100%;height:200px;touch-action:none}.padActions{display:flex;justify-content:flex-end;margin-top:8px}.padActions button{padding:8px 13px}
    button{border:1px solid var(--line);border-radius:13px;padding:15px;font:inherit;font-weight:900;cursor:pointer;transition:transform .16s ease,filter .16s ease,opacity .16s ease}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{cursor:wait;opacity:.55;transform:none}.buttons{display:grid;grid-template-columns:1fr 2fr;gap:11px;margin-top:18px}.decline{background:#34191d;color:#ffd9dc;border-color:#6e3038}.approve{background:var(--green);color:#10160e;border-color:#d9ffad;box-shadow:0 10px 30px #75b52d35}.secondary{background:#1a231d;color:var(--text)}
    .status{text-align:center;padding:34px 22px}.statusIcon{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 15px;border-radius:50%;font-size:31px;font-weight:950;background:#263027;color:var(--green);border:1px solid #66814f}.status h1{margin:7px 0;font-size:27px}.status.error .statusIcon{color:#ff9d99;border-color:#7d3840;background:#32191c}.loading{min-height:280px;display:grid;place-items:center;text-align:center}.spinner{width:48px;height:48px;border:3px solid #334139;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.foot{font-size:12px;text-align:center;color:var(--muted);margin-top:22px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){main{padding:18px 12px 44px}.card{padding:17px;border-radius:17px}.hero h1{font-size:25px}.doc{text-align:left}.buttons,.previous{grid-template-columns:1fr}.approve{order:-1}.row{grid-template-columns:1fr}.row strong{text-align:right}.top{align-items:flex-start}.secure{max-width:135px;text-align:right}.pad canvas{height:180px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <div class="top"><div class="brand">AUTO<i>LOGIKA</i></div><div class="secure">Bezpieczna decyzja klienta</div></div>
    <div id="app" class="card loading"><div><div class="spinner"></div><p>Wczytywanie zakresu naprawy…</p></div></div>
    <p class="foot">Link jest jednorazowy i zabezpieczony losowym tokenem. Decyzja jest zapisywana z datą oraz sumą kontrolną dokumentu.</p>
  </main>
  <script>
    (()=>{
      const endpoint='https://aeikhyntzrynpypleqqe.supabase.co/functions/v1/approval'
      const app=document.getElementById('app')
      const token=new URLSearchParams(location.hash.slice(1)).get('t')||''
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))
      const money=value=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(value)||0)
      const date=value=>value?new Date(value).toLocaleString('pl-PL'):'—'
      const kindLabel=value=>({ROBOCIZNA:'Robocizna',CZESC:'Część',OPLATA:'Opłata',RABAT:'Rabat',KOREKTA:'Korekta',USLUGA_ZEW:'Usługa zewnętrzna'}[String(value||'').toUpperCase()]||String(value||'Pozycja'))
      let approval=null,expiresAt='',drawing=false,points=0,last=null,canvas=null,ctx=null

      async function request(payload){
        const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,token})})
        let result={};try{result=await response.json()}catch{}
        if(!response.ok||!result.ok)throw new Error(result.error||'Nie udało się połączyć z usługą akceptacji.')
        return result
      }
      function status(title,text,error=false){app.className=`card status${error?' error':''}`;app.innerHTML=`<div class="statusIcon">${error?'!':'✓'}</div><div class="eyebrow">AUTOLOGIKA · DECYZJA KLIENTA</div><h1>${esc(title)}</h1><p class="muted">${esc(text)}</p>`}
      function terminal(record){
        const labels={APPROVED:['Akceptacja została zapisana',`Dziękujemy. Warsztat otrzymał Twoją decyzję ${date(record.decidedAt)}.`],DECLINED:['Odrzucenie zostało zapisane',`Warsztat otrzymał Twoją decyzję ${date(record.decidedAt)}.`],EXPIRED:['Link wygasł','Poproś warsztat o przygotowanie nowego linku.'],SUPERSEDED:['Link jest nieaktualny','Zakres został zastąpiony nowszą wyceną. Poproś warsztat o aktualny link.']}
        const item=labels[record.status]||['Link nie jest już aktywny','Skontaktuj się z warsztatem.'];status(item[0],item[1],record.status!=='APPROVED')
      }
      function render(record){
        approval=record.approval;expiresAt=record.expiresAt
        if(record.status!=='PENDING'){terminal(record);return}
        const vehicle=`${approval.vehicle?.make||''} ${approval.vehicle?.model||''}`.trim()||'Pojazd'
        const plate=approval.vehicle?.plate||'bez numeru rejestracyjnego',vin=approval.vehicle?.vin?` · VIN ${approval.vehicle.vin}`:''
        const items=(approval.items||[]).map(item=>`<div class="row"><div><b>${esc(item.name)}</b>${item.variant?`<span>${esc(item.variant)}</span>`:''}<small>${esc(kindLabel(item.kind))} · ${esc(item.quantity)} ${esc(item.unit)} × ${money(item.unitPrice)}</small>${item.description?`<p>${esc(item.description)}</p>`:''}</div><strong>${money(item.value)}</strong></div>`).join('')
        const summary=approval.additionalScope?`<div class="card previous"><div><span>WCZEŚNIEJ ZAAKCEPTOWANO</span><b>${money(approval.previouslyApprovedTotal)}</b></div><div><span>DODATKOWY ZAKRES</span><b>${money(approval.additionalTotal)}</b></div><div><span>NOWA ŁĄCZNA WARTOŚĆ</span><b>${money(approval.newCombinedTotal)}</b></div></div>`:''
        const customer=[approval.customer?.name,approval.customer?.company].filter(Boolean).join(' · ')
        const documentNo=approval.approvalDocumentNo||approval.documentNo||`Zlecenie #${approval.orderId}`
        app.className='';app.innerHTML=`<section class="card hero"><div><div class="eyebrow">AKCEPTACJA NAPRAWY</div><h1>${esc(vehicle)}</h1><div class="muted">${esc(plate+vin)}</div>${customer?`<div class="muted">Klient: ${esc(customer)}</div>`:''}</div><div class="doc"><b>${esc(documentNo)}</b><span>Akceptacja ${esc(approval.approvalSequence)}</span></div></section>${summary}<section class="card items"><div class="eyebrow">ZAKRES PRAC</div>${approval.scope?`<p class="muted">${esc(approval.scope)}</p>`:''}${items}<div class="total">${money(approval.additionalScope?approval.additionalTotal:approval.totals?.gross)}</div></section><section class="card"><div class="eyebrow">ZGODA ${esc(approval.terms?.version||'')}</div><p>${esc(approval.terms?.text||'')}</p><label class="consent"><input type="checkbox" id="terms"><span>Zapoznałem/am się z zakresem i kosztami oraz akceptuję wykonanie przedstawionych prac.</span></label><label>Podpis klienta</label><div class="pad"><canvas id="signature" aria-label="Pole podpisu klienta"></canvas></div><div class="padActions"><button type="button" class="secondary" id="clear">Wyczyść podpis</button></div><label for="note">Powód odrzucenia (opcjonalnie)</label><textarea id="note" maxlength="1000" placeholder="Możesz krótko wyjaśnić decyzję"></textarea><div class="buttons"><button type="button" class="decline" id="decline">ODRZUĆ</button><button type="button" class="approve" id="approve">PODPISZ I AKCEPTUJ</button></div></section><p class="foot">Link wygasa ${date(expiresAt)}.</p>`
        setupSignature();document.getElementById('approve').onclick=()=>decide('APPROVED');document.getElementById('decline').onclick=()=>decide('DECLINED')
      }
      function setupSignature(){
        canvas=document.getElementById('signature');ctx=canvas.getContext('2d')
        const resize=()=>{const rect=canvas.getBoundingClientRect(),ratio=Math.max(1,devicePixelRatio||1),saved=points?canvas.toDataURL():'';canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';if(saved){const image=new Image();image.onload=()=>ctx.drawImage(image,0,0,rect.width,rect.height);image.src=saved}}
        const point=event=>{const rect=canvas.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top}}
        canvas.addEventListener('pointerdown',event=>{event.preventDefault();drawing=true;last=point(event);canvas.setPointerCapture(event.pointerId)})
        canvas.addEventListener('pointermove',event=>{if(!drawing)return;event.preventDefault();const next=point(event);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(next.x,next.y);ctx.stroke();last=next;points++})
        canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false)
        document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);points=0}
        resize();addEventListener('resize',resize)
      }
      async function decide(decision){
        const termsAccepted=document.getElementById('terms').checked,note=document.getElementById('note').value
        if(decision==='APPROVED'&&!termsAccepted){alert('Zaznacz zgodę na zakres i koszty.');return}
        if(decision==='APPROVED'&&points<3){alert('Złóż podpis w wyznaczonym polu.');return}
        const question=decision==='APPROVED'?'Czy na pewno podpisać i zaakceptować przedstawiony zakres oraz koszty?':'Czy na pewno odrzucić przedstawiony zakres?'
        if(!confirm(question))return
        document.querySelectorAll('button').forEach(button=>button.disabled=true)
        try{const result=await request({action:'decide',decision,note,termsAccepted,signature:decision==='APPROVED'?canvas.toDataURL('image/png'):'',signaturePoints:points});terminal(result)}catch(error){alert(error.message);document.querySelectorAll('button').forEach(button=>button.disabled=false)}
      }
      if(!/^[a-f0-9]{48,128}$/i.test(token)){status('Link jest nieprawidłowy','Poproś warsztat o wygenerowanie nowego linku.',true);return}
      request({action:'load'}).then(render).catch(error=>status('Nie udało się otworzyć akceptacji',error.message,true))
    })()
  </script>
</body>
</html>
